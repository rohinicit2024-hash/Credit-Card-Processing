<!DOCTYPE html>
<html>

<head>

    <title>Transaction History</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="dashboard">

        <h1>
            Credit Card Processing System
        </h1>

        <h2>
            Transaction History
        </h2>


        <div class="section">

            <h3>
                ● Previous Transactions
            </h3>


            <table>

                <thead>

                    <tr>

                        <th>Date</th>

                        <th>Time</th>

                        <th>Transaction ID</th>

                        <th>Card Holder</th>

                        <th>Amount</th>

                        <th>Status</th>

                    </tr>

                </thead>


                <tbody id="transactionTable">

                </tbody>

            </table>

        </div>


        <button
            onclick="window.location.href='dashboard.html'"
        >
            Back to Dashboard
        </button>


        <button
            class="logout"
            onclick="logout()"
        >
            Logout
        </button>

    </div>


    <script src="script.js"></script>

    <script>

        checkUser();
        loadTransactions();

    </script>

</body>

</html>
